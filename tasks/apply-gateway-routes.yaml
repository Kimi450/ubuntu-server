- name: Apply HTTPRoute {{ service_namespace }}
  shell: |
    kubectl apply -f - <<EOF
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: {{ service_name }}-route
      spec:
        parentRefs:
        - name: {{ gateway_controller_name }}
          namespace: {{ namespace_gateway_controller }}
        hostnames:
        - {{ service_hostname }}
        rules:
        - backendRefs:
          - name: {{ service_name }}
            port: {{ service_port }}
            namespace: {{ service_namespace }}
    EOF
- name: Apply TLSRoute on {{ service_namespace }}
  shell: |
    kubectl apply -f - <<EOF
      apiVersion: gateway.networking.k8s.io/v1
      kind: TLSRoute
      metadata:
        name: {{ service_name }}-route
      spec:
        parentRefs:
        - name: {{ gateway_controller_name }}
          namespace: {{ namespace_gateway_controller }}
        hostnames:
        - {{ service_hostname }}
        rules:
        - backendRefs:
          - name: {{ service_name }}
            port: {{ service_port }}
            namespace: {{ service_namespace }}
    EOF