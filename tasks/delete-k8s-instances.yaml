- name: "Get all '{{ kind }}' from namespace '{{ delete_namespace }}'s that contain '{{ contains }}'"
  vars:
    ansible_python_interpreter: "{{ venv_python }}"
  kubernetes.core.k8s_info:
    kind: "{{ kind }}"
    namespace: "{{ delete_namespace }}"
  register: output

- name: "Delete all '{{ kind }}' from namespace '{{ delete_namespace }}' that contain '{{ contains }}'"
  vars:
    ansible_python_interpreter: "{{ venv_python }}"
  kubernetes.core.k8s:
    kind: "{{ kind }}"
    namespace: "{{ delete_namespace }}"
    name: "{{ item }}"
    state: absent
  loop: "{{ output.resources | map(attribute='metadata.name') | select('search', contains) | list }}"
