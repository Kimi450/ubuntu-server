- name: "Create {{ repo_dir }} directory"
  file:
    path: "{{ repo_dir }}"
    recurse: True
    state: directory
    mode: '0755'

- name: Clone repo
  git:
    repo: "{{ repo_link }}"
    dest: "{{ repo_dir }}"
    update: true
    # discard local modifications (e.g. generated files) so the pull never fails
    force: true
