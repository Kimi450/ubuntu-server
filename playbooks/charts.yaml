    - name: Install calibre
      when: charts.services.calibre.enabled
      block:
      - name: Install/Upgrade the calibre chart
        include_tasks: ../tasks/install-chart.yaml
        vars:
          repo_name: TrueCharts
          repo_link: oci://oci.trueforge.org/truecharts
          install_namespace: "{{ namespace_generic_services }}"
          chart_timeout: "{{ charts.timeout }}"
          release_name: calibre
          chart_name: calibre
          version: "{{ charts.services.calibre.version }}"
          # PUID={{ uid }} gives write access on the pod
          # 568 is the default user ID, added to the groups cause why not
          # securityContext.container.seccompProfile.type is required for the
          # guacamole VNC client to be able to make sys calls (required )
          set_options: "--set \
            {{ helm_common_general }},\
            {{ helm_common_persistence }},\
            {{ helm_common_persistence_books }}\
            {{ helm_common_persistence_downloads }}\
            {{ helm_common_resources}},\
            resources.limits.cpu={{ charts.services.calibre.resources.limits.cpu }},\
            resources.limits.memory={{ charts.services.calibre.resources.limits.memory }},\
            securityContext.container.PUID=\"{{ uid }}\",\
            securityContext.container.PGID=\"568\",\
            securityContext.container.seccompProfile.type=Unconfined,\
            service.main.type=NodePort,\
            service.main.ports.main.nodePort=30000,\
            service.webserver.enabled=true"

      - debug:
          msg: >
            You can log into calibre at '{{ ip }}:30000'.
            Data directories from the host are available under '/mnt-data' and
            can be used by the application.


    - name: Install palworld-server
      when: charts.services.palworld_server.enabled
      block:
      - name: Create ns
        ansible.builtin.shell: kubectl create ns {{ namespace_palworld }}
        ignore_errors: true

      - name: Create secret
        ansible.builtin.shell: |
          kubectl create secret generic -n {{ namespace_palworld }} palworld-passwords \
            --from-literal=SERVER_PASSWORD="{{ charts.services.palworld_server.server_password }}" \
            --from-literal=ADMIN_PASSWORD="{{ charts.services.palworld_server.admin_password }}"
        ignore_errors: true

      - name: Install/Upgrade the palworld-server chart
        include_tasks: ../tasks/install-chart.yaml
        vars:
          repo_name: kriegalex
          repo_link: https://kriegalex.github.io/k8s-charts/
          install_namespace: "{{ namespace_palworld }}"
          chart_timeout: "{{ charts.timeout }}"
          release_name: palworld-server
          chart_name: palworld-server
          version: "{{ charts.services.palworld_server.version }}"
          set_options: "--set \
            secret.existingSecret=palworld-passwords,\
            service.type=ClusterIP"

      - name: Apply envoyproxy for config
        ansible.builtin.shell: |
          kubectl apply -f - <<EOF
            apiVersion: gateway.envoyproxy.io/v1alpha1
            kind: EnvoyProxy
            metadata:
              name: custom-proxy-config
              namespace: {{ namespace_palworld }}
            spec:
              provider:
                type: Kubernetes
                kubernetes:
                  envoyService:
                    type: NodePort
                    externalTrafficPolicy: Local
                    patch:
                      type: StrategicMerge
                      value:
                        spec:
                          ports:
                            - name: palworld-udp
                              nodePort: {{ charts.services.palworld_server.node_port }}
                              port: 8211
          EOF

      - name: Apply gateway class
        ansible.builtin.shell: |
          kubectl apply -f - <<EOF
            apiVersion: gateway.networking.k8s.io/v1
            kind: GatewayClass
            metadata:
              name: palworld-server
            spec:
              controllerName: gateway.envoyproxy.io/gatewayclass-controller
              parametersRef:
                group: gateway.envoyproxy.io
                kind: EnvoyProxy
                name: custom-proxy-config
                namespace: {{ namespace_palworld }}
          EOF

      - name: Apply gateway
        ansible.builtin.shell: |
          kubectl apply -f - <<EOF
            apiVersion: gateway.networking.k8s.io/v1
            kind: Gateway
            metadata:
              name: palworld-gateway
              namespace: {{ namespace_palworld }}
              annotations:
                # https://cert-manager.io/docs/usage/gateway/
                cert-manager.io/cluster-issuer: letsencrypt-prod
            spec:
              gatewayClassName: palworld-server
              listeners:
                - name: palworld-udp
                  protocol: UDP
                  port: 8211
                  allowedRoutes:
                    kinds:
                      - kind: UDPRoute
                    namespaces:
                      from: All
          EOF

      - name: Apply route
        ansible.builtin.shell: |
          kubectl apply -f - <<EOF
            apiVersion: gateway.networking.k8s.io/v1
            kind: UDPRoute
            metadata:
              name: palworld-game-route
              namespace: palworld-server
            spec:
              parentRefs:
                - name: palworld-gateway
                  namespace: {{ namespace_palworld }}
                  sectionName: palworld-udp
              rules:
                - backendRefs:
                    - name: palworld-server
                      port: 8211
          EOF
