            {{ helm_common_persistence }},\
            {{ helm_common_persistence_config }},\
            {{ helm_common_resources}},\
            resources.limits.cpu={{ charts.services.librespeed.resources.limits.cpu }},\
            resources.limits.memory={{ charts.services.librespeed.resources.limits.memory }},\
            persistence.config.hostPath={{ charts.services.configs_dir }}/librespeed,\
            securityContext.container.PUID=\"{{ uid }}\",\
            securityContext.container.PGID=\"568\""

      - name: Apply gateway routes
        include_tasks: ../tasks/apply-gateway-routes.yaml
        vars:
          service_name: "librespeed"
          service_namespace: "{{ namespace_generic_services }}"
          service_hostname: "librespeed.{{ domain_name }}"
          service_port: "10016"

      - debug:
          msg: >
            You can log into librespeed at 'librespeed.{{ domain_name }}'.

