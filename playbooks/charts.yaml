            {{ helm_common_persistence }},\
            {{ helm_common_persistence_books }}\
            {{ helm_common_persistence_downloads }}\
            {{ helm_common_resources}},\
            resources.limits.cpu={{ charts.services.calibre_web.resources.limits.cpu }},\
            resources.limits.memory={{ charts.services.calibre_web.resources.limits.memory }},\
            securityContext.container.PUID=\"{{ uid }}\",\
            securityContext.container.PGID=\"568\""

      - name: Apply gateway routes
        include_tasks: ../tasks/apply-gateway-routes.yaml
        vars:
          service_name: "calibre-web"
          service_namespace: "{{ namespace_generic_services }}"
          service_hostname: "calibre-web.{{ domain_name }}"
          service_port: "8083"

      - debug:
          msg: >
            You can log into calibre-web at 'calibre-web.{{ domain_name }}'.
